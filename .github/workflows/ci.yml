name: Continuous Integration

on: [push, pull_request]

env:
  rust_stable: stable
  rust_clippy: '1.95.0'
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Check clippy lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ env.rust_clippy }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_clippy }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: "cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings"
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

  docs:
    name: Check documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
      - uses: Swatinem/rust-cache@v2
      - name: "cargo doc --no-deps"
        run: cargo doc --no-deps
        env:
          # To catch warnings as well as errors by turning them into a job failure
          RUSTDOCFLAGS: -Dwarnings

  tests:
    name: Run tests (${{ matrix.runner }}, VPP ${{ matrix.vpp }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # It's useful to know all of the failures up front in case they are different between the
      # variants
      fail-fast: false
      matrix:
        include:
          - { runner: 'ubuntu-24.04', vpp: '26.02' }
          - { runner: 'ubuntu-24.04-arm', vpp: '26.02' }
          # 26.06 renamed its x86_64 march variants (scalar, x86_64_v3, x86_64_v4), which the
          # node macro does not register yet, so 26.06 is tested on aarch64 only.
          - { runner: 'ubuntu-24.04-arm', vpp: '26.06' }
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
      - uses: Swatinem/rust-cache@v2
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: vpp-${{ matrix.vpp }}-${{ matrix.runner }}
      - name: Install vpp ${{ matrix.vpp }}
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          srcdir="$(pwd)"
          mkdir /tmp/build
          cd /tmp/build
          git clone --depth 1 -b v${{ matrix.vpp }} https://gerrit.fd.io/r/vpp
          cd vpp
          make install-dep
          make pkg-deb
          sudo dpkg -i build-root/*.deb
      - name: Run unit tests
        run: cargo test --workspace
      - name: Run integration tests
        run: tests/run /tmp/build/vpp
        env:
          OUTPUT_LOGS_ON_FAILURE: 1
